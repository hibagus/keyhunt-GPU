name: CPU and documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check documentation
        run: python3 tools/check_docs.py
      - name: Configure CPU build
        run: cmake --preset cpu-release
      - name: Build
        run: cmake --build --preset cpu-release --parallel 2
      - name: Check CPU behavior
        run: ctest --preset cpu-release
      - name: Run documented examples
        run: >-
          python3 tests/integration/readme_examples.py
          --binary build/cpu-release/keyhunt
          --report build/cpu-release/readme-examples.json
