name: CPU and documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check documentation
        run: python3 tools/check_docs.py
      - name: Install SQLite 3.51.3
        shell: bash
        run: |
          # Ubuntu 22.04's SQLite predates the required WAL-reset fix.
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 \
            --output sqlite-autoconf-3510300.tar.gz \
            https://www.sqlite.org/2026/sqlite-autoconf-3510300.tar.gz
          echo '81f5be397049b0cae1b167f2225af7646fc0f82e4a9b3c48c9ea3a533e21d77a  sqlite-autoconf-3510300.tar.gz' | sha256sum --check
          tar -xzf sqlite-autoconf-3510300.tar.gz
          cd sqlite-autoconf-3510300
          ./configure --prefix="$RUNNER_TEMP/sqlite" --disable-shared --disable-readline
          make --jobs=2
          make install
      - name: Configure CPU build
        run: >-
          cmake --preset cpu-release
          -DSQLite3_INCLUDE_DIR="$RUNNER_TEMP/sqlite/include"
          -DSQLite3_LIBRARY="$RUNNER_TEMP/sqlite/lib/libsqlite3.a"
      - name: Build
        run: cmake --build --preset cpu-release --parallel 2
      - name: Check CPU behavior
        run: ctest --preset cpu-release
      - name: Run documented examples
        run: >-
          python3 tests/integration/readme_examples.py
          --binary build/cpu-release/keyhunt
          --report build/cpu-release/readme-examples.json
